name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    if: github.event_name != 'push' || !github.event.deleted
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.13'
        os:
          - ubuntu-latest
        arch:
          - x64
    steps:
      - uses: actions/checkout@v3
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      - name: Check Runic formatting
        run: |
          julia --startup-file=no --project=@runic-ci -e 'using Pkg; Pkg.add(PackageSpec(; name="Runic", version=v"1.13.0"))'
          git ls-files -z -- '*.jl' | xargs -0 --no-run-if-empty julia --startup-file=no --project=@runic-ci -m Runic --check --diff
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
  register:
    name: Request General registration
    needs: test
    if: github.event_name == 'push' && github.ref_type == 'tag' && !github.event.deleted
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate release tag and submit to Registrator
        env:
          GH_TOKEN: ${{ secrets.REGISTRATOR_TOKEN }}
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            exit 0
          fi
          python3 - <<'CHECK'
          import os
          import tomllib

          with open("Project.toml", "rb") as project:
              expected = "v" + tomllib.load(project)["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != expected:
              raise SystemExit(f"Tag {tag} must match Project.toml version {expected}")
          CHECK
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::Set the REGISTRATOR_TOKEN repository secret."
            exit 1
          fi
          commit=$(git rev-parse --verify 'HEAD^{commit}')
          gh api --method POST "repos/$GITHUB_REPOSITORY/commits/$commit/comments" \
            -f 'body=@JuliaRegistrator register' --silent
